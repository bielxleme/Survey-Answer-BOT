name: APK Android (Research Agent)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 2.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Assinatura opcional por secrets (recomendado para distribuir a terceiros).
      # Sem secrets, usa android/keystore/research-agent.jks (mesma chave em todo build → atualiza por cima).
      - name: Preparar chave de assinatura (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../ResearchAgent.apk

      - name: Enviar APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: ResearchAgent-apk
          path: ResearchAgent.apk
          if-no-files-found: error

      - name: Testes unitários e de integração
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Publicar no GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Research Agent 2.0.${{ github.run_number }}
          body: |
            APK nativo do Research Agent (Android 8.0+).
            Instalação: baixe **ResearchAgent.apk**, abra no celular e permita "instalar apps desconhecidos".
            Depois ative o serviço em Configurações → Acessibilidade → Research Agent.
            (Android 13+: se aparecer "Configuração restrita", vá em Informações do app → ⋮ → Permitir configurações restritas.)
          files: ResearchAgent.apk
          make_latest: true
